apis:
- name: Plixer Scrutinizer REST API
  description: >-
    REST API for Plixer Scrutinizer flow analytics — run flow reports, manage
    alarms, tune detections, trigger packet captures, and work with Collections.
    Scrutinizer is deployed as a self-hosted appliance/instance, so the API is
    served from the customer's own Scrutinizer host (path /api/). Reference
    documentation is published on docs.plixer.com (login required).
  humanURL: https://docs.plixer.com/projects/scrutinizer/en/latest/
