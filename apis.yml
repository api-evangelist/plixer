aid: plixer
name: Plixer
description: >-
  Plixer is a network observability and defense company whose platform combines
  network flow (NetFlow/IPFIX) data with AI-driven analysis to help IT and
  security teams investigate incidents, detect threats, and optimize performance
  across on-premises, cloud, and zero-trust environments. Its products include
  Plixer One (unified observability), Plixer Scrutinizer (flow-first visibility
  with a native MCP server), FlowPro (threat detection), Replicator (NetFlow
  distribution), Machine Learning behavioral analytics, Endpoint Analytics, and
  an AI Assistant for natural-language queries grounded in flow data. Plixer
  Scrutinizer exposes a REST API and, as of Plixer 19.8, a native Model Context
  Protocol server. Backed by Battery Ventures.
